<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Set the theme before first paint so there is no light/dark flash.
         Honors a saved choice, otherwise the visitor's system preference. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Understory Collaborative</title>
    <meta name="description" content="When a project is late, a team is stuck, or your tooling has gotten away from you, we've worked through it before. A few questions will tell you how serious it is.">
    <meta name="theme-color" content="#1c2902" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f4f2e4" media="(prefers-color-scheme: light)">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Understory Collaborative">
    <meta property="og:title" content="Understory Collaborative">
    <meta property="og:description" content="When a project is late, a team is stuck, or your tooling has gotten away from you, we've worked through it before. A few questions will tell you how serious it is.">
    <meta property="og:url" content="https://understorycollab.com/">
    <meta property="og:image" content="/og-image.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Understory Collaborative">
    <meta name="twitter:description" content="When a project is late, a team is stuck, or your tooling has gotten away from you, we've worked through it before. A few questions will tell you how serious it is.">
    <meta name="twitter:image" content="/og-image.png">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
